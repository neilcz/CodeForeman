services:
  codeforeman:
    build: .
    container_name: codeforeman
    restart: unless-stopped
    ports:
      - "3780:3780"
    # 资源限制：防止失控的 Claude 子进程拖垮宿主机
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
    environment:
      PORT: 3780
      DATA_DIR: /data
      # 必须和下方挂载点一致：容器内看到的项目根目录
      PROJECTS_DIR: /projects
    # Claude 凭证与模型配置（见 .env.example；支持 Kimi 等兼容端点或官方订阅）
    # 管理员初始密码也在 .env 里设置：ADMIN_PASSWORD=xxx（不设置则默认 admin/admin 并告警）
    env_file:
      - .env
    volumes:
      # 代码在宿主机磁盘，git 管理；容器只是挂载使用。
      # 宿主机路径在 .env 的 HOST_PROJECTS_DIR 配置（默认 ./data/projects），
      # 其下每个一级子文件夹会被自动发现为一个项目
      - ${HOST_PROJECTS_DIR:-./data/projects}:/projects
      - codeforeman-db:/data/db
      # Claude 登录态持久化：容器重建后不必重新登录
      - claude-config:/root/.claude
      # SSH key 挂载点：entrypoint 会复制到容器内 /root/.ssh 并修正权限。
      # 注意：容器内无交互，带 passphrase 的 key 无法用（macOS keychain 也不可用），
      # 需用无密码 key，或在 .env 把 HOST_SSH_DIR 指向放有无密码 key 的目录。
      # 也可以不挂载，直接在「SSH Key」页面生成/导入 key（存于 codeforeman-ssh 卷）
      - ${HOST_SSH_DIR:-~/.ssh}:/ssh-host:ro
      # 「SSH Key」页面管理的 key 持久化
      - codeforeman-ssh:/data/ssh-keys

volumes:
  codeforeman-db:
  claude-config:
  codeforeman-ssh:
